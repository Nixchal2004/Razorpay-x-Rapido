<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/colors.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/typography.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/radius.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/elevation.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/components/_generated/fig-tokens.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/components/_generated/fig-typography.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/components/_generated/fig-assets.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/base.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/styles.css">
<script src="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;background:#EDEBE7;display:flex;justify-content:center;align-items:flex-start;padding:32px 0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}*{box-sizing:border-box}a{color:#4285F4}a:hover{color:#1A1A1A}::-webkit-scrollbar{width:0}@keyframes fmMark{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}@keyframes fmRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
</helmet>
<div style="width:390px;height:844px;background:#FAFAFA;display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:14px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">

<div style="flex-shrink:0;background:#FFFFFF"><x-import component-from-global-scope="RapidoDesignSystem_ef9315.StatusBar" hint-size="390px,54px"></x-import></div>

<div style="flex-shrink:0;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px">
  <button type="button" aria-label="Menu" style="width:44px;height:44px;margin-left:-11px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer">
    <i data-lucide="menu" style="width:22px;height:22px;color:#1A1A1A"></i>
  </button>
  <div style="display:flex;align-items:center;gap:6px">
    <span style="font-weight:800;font-size:22px;line-height:1;letter-spacing:-1px;color:#1A1A1A">rapido</span>
    <span style="width:6px;height:6px;border-radius:50%;background:#FDC830"></span>
  </div>
  <button type="button" aria-label="Notifications" style="width:44px;height:44px;margin-right:-11px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative">
    <i data-lucide="bell" style="width:21px;height:21px;color:#1A1A1A"></i>
    <span style="position:absolute;top:11px;right:12px;width:7px;height:7px;border-radius:50%;background:#EA4335;box-shadow:0 0 0 2px #FFFFFF"></span>
  </button>
</div>

<div style="flex:1;overflow-y:auto;padding:56px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:20px">

  <div style="width:72px;height:72px;border-radius:999px;background:#FFF3CC;display:flex;align-items:center;justify-content:center;animation:fmMark 420ms ease both">
    <i data-lucide="handshake" style="width:34px;height:34px;color:#B98A00"></i>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;animation:fmRise 420ms ease 80ms both">
    <span style="font-weight:700;font-size:24px;line-height:31px;color:#1A1A1A;text-align:center;text-wrap:pretty">{{ headline }}</span>
    <span style="font-weight:400;font-size:14px;line-height:21px;color:#666666;text-align:center;text-wrap:pretty">{{ body }}</span>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;animation:fmRise 420ms ease 160ms both">
    <span style="font-weight:800;font-size:34px;line-height:1;color:#1A1A1A;font-variant-numeric:tabular-nums">{{ amount }}</span>
    <span style="font-weight:500;font-size:13px;line-height:18px;color:#888888">{{ deadline }}</span>
  </div>
</div>

<div style="flex-shrink:0;background:#FFFFFF;box-shadow:inset 0 -1px 0 #EBEBEB;padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px">
  <a href="4. Rider Dues Dashboard.dc.html" style="{{ primaryBtn }}" style-active="background:#E5A800">View pending dues</a>
  
</div>

<div style="flex-shrink:0;background:#FFFFFF;box-shadow:inset 0 1px 0 #EBEBEB;display:flex;padding:8px 0 6px">
  <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
    <a href="{{ item.href }}" style="flex:1;text-decoration:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative">
      <i data-lucide="{{ item.icon }}" style="width:21px;height:21px;color:{{ item.color }}"></i>
      <span style="font-size:10px;line-height:1;font-weight:{{ item.weight }};color:{{ item.color }}">{{ item.label }}</span>
      <sc-if value="{{ item.showDot }}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute;top:2px;right:20px;width:8px;height:8px;border-radius:999px;background:#EA4335"></span>
      </sc-if>
    </a>
  </sc-for>
</div>
<div style="height:22px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:134px;height:5px;border-radius:999px;background:#1A1A1A"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:908},&quot;amount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;₹120&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;captainName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ramesh&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const mask = (name, color, size) =>
  "width:" + size + "px;height:" + size + "px;margin-top:2px;flex-shrink:0;background:" + color
  + ";-webkit-mask:url('https://unpkg.com/lucide-static@0.469.0/icons/" + name + ".svg') center/contain no-repeat"
  + ";mask:url('https://unpkg.com/lucide-static@0.469.0/icons/" + name + ".svg') center/contain no-repeat";

class Component extends DCLogic {
  icons() { if (window.lucide) window.lucide.createIcons(); }
  componentDidMount() { this.icons(); this._i = setInterval(() => this.icons(), 400); }
  componentDidUpdate() { this.icons(); }
  componentWillUnmount() { clearInterval(this._i); }

  renderVals() {
    const amount = this.props.amount ?? "₹120";
    const captain = this.props.captainName ?? "Ramesh";
    return {
      amount,
      headline: "Thank you — " + captain + " trusted you to pay later",
      body: "Your fare has moved to Dues.",
      deadline: "Due by 6:15 PM today",
      payLabel: "Pay " + amount + " now",
      primaryBtn: "width:100%;min-height:50px;border-radius:12px;border:0;background:#FDC830;color:#1A1A1A;text-decoration:none;font-family:inherit;font-size:15px;font-weight:700;line-height:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 180ms ease;padding:0 16px",
      linkBtn: "width:100%;min-height:44px;text-decoration:none;font-family:inherit;font-size:13px;font-weight:600;line-height:18px;color:#4285F4;cursor:pointer;display:flex;align-items:center;justify-content:center",
      navItems: [
        {icon:"bike", label:"Ride", href:"3. Rider Home Dues Popup.dc.html"},
        {icon:"receipt-text", label:"Dues", active:true, showDot:true, href:"4. Rider Dues Dashboard.dc.html"},
        {icon:"layout-grid", label:"All Services", href:"#"},
        {icon:"plane", label:"Travel", href:"#"},
        {icon:"user-round", label:"Profile", href:"#"}
      ].map(n => ({
        ...n,
        color: n.active ? "#E5A800" : "#888888",
        weight: n.active ? 700 : 400,
        showDot: !!n.showDot
      }))
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/colors.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/typography.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/radius.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/tokens/elevation.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/components/_generated/fig-tokens.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/components/_generated/fig-typography.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/components/_generated/fig-assets.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/base.css">
<link rel="stylesheet" href="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/styles.css">
<script src="_ds/rapido-design-system-ef93156a-58e6-4d76-8ff6-d1a1bc1c294d/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;background:#EDEBE7;display:flex;justify-content:center;align-items:flex-start;padding:32px 0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}*{box-sizing:border-box}a{color:#4285F4}a:hover{color:#1A1A1A}::-webkit-scrollbar{width:0}@keyframes ddSheet{from{transform:translateY(24px)}to{transform:translateY(0)}}@keyframes ddToast{0%{opacity:0}10%{opacity:1}82%{opacity:1}100%{opacity:0}}</style>
</helmet>
<div style="width:390px;height:844px;background:#FAFAFA;display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:14px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">

<div style="flex-shrink:0;background:#FFFFFF"><x-import component-from-global-scope="RapidoDesignSystem_ef9315.StatusBar" hint-size="390px,54px"></x-import></div>

<div style="flex-shrink:0;background:#FFFFFF;display:flex;align-items:center;gap:2px;padding:2px 16px 12px">
  <button type="button" onClick="{{ goHome }}" aria-label="Back" style="width:44px;height:44px;margin-left:-13px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer">
    <i data-lucide="chevron-left" style="width:24px;height:24px;color:#1A1A1A"></i>
  </button>
  <span style="font-weight:700;font-size:20px;line-height:26px;color:#1A1A1A">Dues</span>
</div>

<sc-if value="{{ showFlagStrip }}" hint-placeholder-val="{{ true }}">
  <div role="button" onClick="{{ openFlags }}" style="flex-shrink:0;margin:0 16px 12px;background:#FFF8E1;border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer" style-active="background:#FFF3CC">
    <i data-lucide="alert-triangle" style="width:16px;height:16px;color:#B98A00;flex-shrink:0"></i>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <span style="font-weight:700;font-size:13px;line-height:17px;color:#1A1A1A">{{ flagStripTitle }}</span>
      <span style="font-weight:400;font-size:12px;line-height:16px;color:#666666;text-wrap:pretty">{{ flagStripNote }}</span>
    </div>
    <i data-lucide="chevron-right" style="width:17px;height:17px;color:#B98A00;flex-shrink:0"></i>
  </div>
</sc-if>

<div style="flex-shrink:0;background:#FFFFFF;padding:0 16px">
  <div style="display:flex;border-bottom:1px solid #F0F0F0">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="3">
      <button type="button" onClick="{{ tab.select }}" style="{{ tab.style }}">{{ tab.label }}</button>
    </sc-for>
  </div>
</div>

<div style="flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px">

  <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-weight:600;font-size:10px;line-height:1;letter-spacing:1px;color:#888888">{{ sectionLabel }}</span>
      <div style="background:#FFFFFF;border-radius:12px;box-shadow:inset 0 0 0 1px #F0F0F0;overflow:hidden">
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
          <div role="button" onClick="{{ row.open }}" style="{{ row.wrapStyle }}" style-hover="{{ row.hoverStyle }}" style-active="{{ row.activeStyle }}">
            <div style="display:flex;gap:12px;align-items:center">
              <div style="width:34px;height:34px;border-radius:999px;background:{{ row.bubbleBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <span style="{{ row.glyphStyle }}"></span>
              </div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
                <div style="display:flex;align-items:baseline;gap:8px">
                  <span style="flex:1;min-width:0;font-weight:600;font-size:15px;line-height:20px;color:#1A1A1A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.trip }}</span>
                  <span style="font-weight:700;font-size:15px;line-height:20px;color:#1A1A1A;font-variant-numeric:tabular-nums;flex-shrink:0">{{ row.amount }}</span>
                </div>
                <span style="font-weight:400;font-size:13px;line-height:17px;color:#666666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ row.route }}</span>
                <div style="display:flex;align-items:center;gap:8px;min-width:0;padding-top:1px">
                  <span style="{{ row.badgeStyle }}">{{ row.badge }}</span>
                  <span style="font-weight:400;font-size:12px;line-height:16px;color:#888888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ row.caption }}</span>
                </div>
                <span style="{{ row.reasonStyle }}">{{ row.reason }}</span>
              </div>
              <i data-lucide="chevron-right" style="{{ row.chevronStyle }}"></i>
            </div>
            <div style="{{ row.payWrapStyle }}">
              <button type="button" onClick="{{ row.pay }}" style="{{ row.payStyle }}" style-active="background:#E5A800">{{ row.payLabel }}</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="background:#FFFFFF;border-radius:12px;box-shadow:inset 0 0 0 1px #F0F0F0;padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px">
      <div style="width:56px;height:56px;border-radius:999px;background:#F5F5F5;display:flex;align-items:center;justify-content:center">
        <i data-lucide="{{ emptyIcon }}" style="width:24px;height:24px;color:#AAAAAA"></i>
      </div>
      <span style="font-weight:700;font-size:16px;line-height:22px;color:#1A1A1A;text-align:center">{{ emptyTitle }}</span>
      <span style="font-weight:400;font-size:13px;line-height:19px;color:#888888;text-align:center;text-wrap:pretty;max-width:250px">{{ emptyNote }}</span>
    </div>
  </sc-if>
</div>

<div style="flex-shrink:0;background:#FFFFFF;box-shadow:inset 0 1px 0 #EBEBEB;display:flex;padding:8px 0 6px">
  <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
    <button type="button" onClick="{{ item.select }}" style="flex:1;border:0;background:transparent;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative">
      <i data-lucide="{{ item.icon }}" style="width:21px;height:21px;color:{{ item.color }}"></i>
      <span style="font-size:10px;line-height:1;font-weight:{{ item.weight }};color:{{ item.color }}">{{ item.label }}</span>
      <sc-if value="{{ item.showDot }}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute;top:2px;right:20px;width:8px;height:8px;border-radius:999px;background:#EA4335"></span>
      </sc-if>
    </button>
  </sc-for>
</div>
<div style="height:22px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:134px;height:5px;border-radius:999px;background:#1A1A1A"></div></div>

<sc-if value="{{ paySheetOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:rgba(26,26,26,0.44);display:flex;align-items:flex-end;justify-content:center">
  <div style="width:100%;background:#FFFFFF;border-radius:16px 16px 0 0;padding:12px 16px 22px;display:flex;flex-direction:column;gap:14px;animation:ddSheet 200ms ease">
    <div style="width:38px;height:4px;border-radius:999px;background:#E8E8E8;align-self:center"></div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
      <span style="font-weight:700;font-size:18px;line-height:24px;color:#1A1A1A">Clear this due</span>
      <span style="font-weight:800;font-size:20px;line-height:1;color:#1A1A1A;font-variant-numeric:tabular-nums">{{ payTotal }}</span>
    </div>
    <span style="font-weight:400;font-size:13px;line-height:19px;color:#666666;text-wrap:pretty">{{ payNote }}</span>
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ methods }}" as="method" hint-placeholder-count="3">
        <button type="button" onClick="{{ method.pick }}" style="{{ method.style }}">
          <span style="{{ method.glyphStyle }}"></span>
          <span style="flex:1;text-align:left;font-weight:600;font-size:14px;line-height:18px;color:#1A1A1A">{{ method.label }}</span>
          <span style="{{ method.tickStyle }}"></span>
        </button>
      </sc-for>
    </div>
    <button type="button" onClick="{{ confirmPay }}" style="{{ paySheetBtn }}" style-active="background:#E5A800">{{ payConfirmLabel }}</button>
    <button type="button" onClick="{{ closePay }}" style="width:100%;min-height:44px;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;line-height:18px;color:#666666;cursor:pointer">Go back</button>
  </div>
</div>
</sc-if>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;left:16px;right:16px;bottom:100px;background:#1A1A1A;border-radius:8px;padding:12px 14px;animation:ddToast 2.6s ease forwards">
    <span style="font-weight:500;font-size:13px;line-height:18px;color:#FFFFFF">{{ toast }}</span>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:908},&quot;flagCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
const DUES = [
  {id:"RD1748392045", tab:"pending", trip:"Bike · Today, 9:34 AM", route:"Koramangala 5th Block → HSR Layout",
   amount:"₹120", state:"pending", caption:"Retrying until 6:15 PM today", icon:"clock"},
  {id:"RD1748391884", tab:"pending", trip:"Auto · Yesterday, 8:30 PM", route:"Indiranagar → MG Road Metro",
   amount:"₹220", state:"pending", caption:"Retrying until 6:15 PM today", icon:"clock"},
  {id:"RD1748390977", tab:"flagged", trip:"Bike · 27 Aug, 9:20 PM", route:"BTM Layout → Jayanagar 4th Block",
   amount:"₹95", state:"flagged", caption:"Flagged 2 days ago", icon:"flag",
   reason:"Wasn't settled within the review window."},
  {id:"RD1748390211", tab:"settled", trip:"Bike · 29 Aug, 7:05 PM", route:"BTM Layout → Silk Board Junction",
   amount:"₹95", state:"settled", caption:"Paid by UPI", icon:"check"},
  {id:"RD1748388760", tab:"settled", trip:"Auto · 28 Aug, 1:40 PM", route:"Jayanagar → Koramangala 8th Block",
   amount:"₹180", state:"settled", caption:"Paid by UPI", icon:"check"},
  {id:"RD1748386402", tab:"settled", trip:"Bike · 26 Aug, 10:15 AM", route:"MG Road → Indiranagar 100ft Road",
   amount:"₹60", state:"settled", caption:"Auto-retry succeeded", icon:"check"}
];
const BADGES = {
  review:  {label:"Under review", bg:"#E3F2FD", fg:"#1A5FB8"},
  pending: {label:"Pending", bg:"#FFF8E1", fg:"#8A6400"},
  flagged: {label:"Flagged", bg:"#FDECEA", fg:"#B0342A"},
  settled: {label:"Settled", bg:"#F5F5F5", fg:"#666666"}
};
const BUBBLES = {
  review:  {bg:"#E3F2FD", fg:"#4285F4"},
  pending: {bg:"#FFF8E1", fg:"#B98A00"},
  flagged: {bg:"#FDECEA", fg:"#EA4335"},
  settled: {bg:"#F5F5F5", fg:"#888888"}
};
const EMPTY = {
  pending: {icon:"check-circle", title:"No dues pending", note:"Every fare on your rides has gone through. Nothing to settle."},
  flagged: {icon:"flag", title:"Nothing flagged", note:"No flags on your account. Settling dues on time keeps it that way."},
  settled: {icon:"receipt-text", title:"No settled dues yet", note:"Dues you clear will be listed here with the date and amount."}
};
const LABELS = {pending:"UNRESOLVED DUES", flagged:"NEEDS YOUR ATTENTION", settled:"LAST 30 DAYS"};
const PAY_METHODS = [
  {id:"upi", label:"UPI · 9845* * *210", icon:"smartphone"},
  {id:"card", label:"Card ending 3467", icon:"credit-card"},
  {id:"netbanking", label:"Net banking", icon:"landmark"}
];
const mask = (name, color, size) =>
  "width:" + size + "px;height:" + size + "px;flex-shrink:0;background:" + color
  + ";-webkit-mask:url('https://unpkg.com/lucide-static@0.469.0/icons/" + name + ".svg') center/contain no-repeat"
  + ";mask:url('https://unpkg.com/lucide-static@0.469.0/icons/" + name + ".svg') center/contain no-repeat";

class Component extends DCLogic {
  state = {
    tab: ["flagged", "settled"].indexOf((window.location.hash || "").replace("#", "")) > -1
      ? window.location.hash.replace("#", "") : "pending",
    paid: {}, toast: null, payRow: null, method: "upi"
  };

  icons() { if (window.lucide) window.lucide.createIcons(); }
  componentDidMount() { this.icons(); this._i = setInterval(() => this.icons(), 400); }
  componentDidUpdate() { this.icons(); }
  componentWillUnmount() { clearInterval(this._i); clearTimeout(this._toast); }

  say(msg) {
    clearTimeout(this._toast);
    this.setState({toast: msg});
    this._toast = setTimeout(() => this.setState({toast: null}), 2600);
  }

  tabStyle(active) {
    return "flex:1;border:0;background:transparent;cursor:pointer;padding:0 0 11px;font-family:inherit;font-size:14px;line-height:18px;text-align:center;transition:color 180ms ease;"
      + (active ? "font-weight:700;color:#1A1A1A;box-shadow:inset 0 -2px 0 #FDC830;" : "font-weight:500;color:#888888;");
  }

  badge(state) {
    const b = BADGES[state];
    return "border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;line-height:14px;background:" + b.bg + ";color:" + b.fg + ";white-space:nowrap";
  }

  renderVals() {
    const tab = this.state.tab;
    const flags = this.props.flagCount ?? 1;
    const src = DUES.filter(d => d.tab === tab && !(tab === "flagged" && this.state.paid[d.id]));

    const rows = src.map((r, i) => {
      const paid = !!this.state.paid[r.id];
      return {
        ...r,
        glyphStyle: "width:16px;height:16px;flex-shrink:0;background:" + BUBBLES[r.state].fg
          + ";-webkit-mask:url('https://unpkg.com/lucide-static@0.469.0/icons/" + r.icon
          + ".svg') center/contain no-repeat;mask:url('https://unpkg.com/lucide-static@0.469.0/icons/" + r.icon
          + ".svg') center/contain no-repeat",
        badge: BADGES[r.state].label,
        badgeStyle: this.badge(r.state),
        bubbleBg: BUBBLES[r.state].bg,
        iconColor: BUBBLES[r.state].fg,
        reason: r.reason ?? "",
        reasonStyle: r.state === "flagged"
          ? "font-weight:400;font-size:12px;line-height:17px;color:#B0342A;text-wrap:pretty;padding-top:1px"
          : "display:none",
        chevronStyle: "display:none",
        payWrapStyle: r.state === "flagged" ? "padding:12px 0 0 46px" : "display:none",
        payLabel: paid ? "Paid" : "Pay " + r.amount + " now",
        payStyle: "min-width:150px;min-height:40px;border-radius:12px;border:0;font-family:inherit;font-size:13px;font-weight:700;line-height:18px;cursor:pointer;padding:0 16px;transition:background 180ms ease;"
          + (paid ? "background:#E8E8E8;color:#AAAAAA;" : "background:#FDC830;color:#1A1A1A;"),
        pay: (e) => {
          if (e && e.stopPropagation) e.stopPropagation();
          if (paid) return;
          this.setState({payRow: r, method: "upi"});
        },
        hoverStyle: (r.state === "flagged" || r.state === "settled") ? "" : "background:rgba(0,0,0,0.04)",
        activeStyle: (r.state === "flagged" || r.state === "settled") ? "" : "background:#F5F5F5",
        wrapStyle: "padding:13px 16px;transition:background 180ms ease;"
          + (r.state === "flagged" || r.state === "settled" ? "" : "cursor:pointer;")
          + (i < src.length - 1 ? "box-shadow:inset 0 -1px 0 #F0F0F0;" : ""),
        open: (r.state === "flagged" || r.state === "settled") ? () => {} : () => { window.location.href = "Rider Dues.dc.html"; }
      };
    });

    return {
      paySheetOpen: !!this.state.payRow,
      payTotal: this.state.payRow ? this.state.payRow.amount : "",
      payNote: this.state.payRow
        ? "Clearing this removes the flag on your " + this.state.payRow.trip.replace(/^[A-Za-z]+ · /, "") + " trip and keeps your account in good standing."
        : "",
      payConfirmLabel: this.state.payRow ? "Pay " + this.state.payRow.amount : "Pay",
      paySheetBtn: "width:100%;min-height:50px;border-radius:12px;border:0;background:#FDC830;color:#1A1A1A;font-family:inherit;font-size:15px;font-weight:700;line-height:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 180ms ease;padding:0 16px",
      methods: PAY_METHODS.map(m => {
        const on = m.id === this.state.method;
        return {
          ...m,
          style: "width:100%;min-height:52px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 14px;cursor:pointer;font-family:inherit;background:#FFFFFF;"
            + (on ? "border:1px solid #1A1A1A;" : "border:1px solid #E8E8E8;"),
          glyphStyle: mask(m.icon, on ? "#1A1A1A" : "#888888", 18),
          tickStyle: on ? mask("check", "#1A1A1A", 16) : "display:none",
          pick: () => this.setState({method: m.id})
        };
      }),
      closePay: () => this.setState({payRow: null}),
      confirmPay: () => { const a = this.state.payRow ? this.state.payRow.amount.replace(/[^0-9]/g, "") : ""; window.location.href = "7. Rider Dues Cleared.dc.html?amount=" + a; },
      tabs: ["pending", "flagged", "settled"].map(t => ({
        label: t.charAt(0).toUpperCase() + t.slice(1),
        style: this.tabStyle(t === tab),
        select: () => this.setState({tab: t})
      })),
      rows,
      hasRows: rows.length > 0,
      isEmpty: rows.length === 0,
      sectionLabel: LABELS[tab],
      emptyIcon: EMPTY[tab].icon,
      emptyTitle: EMPTY[tab].title,
      emptyNote: EMPTY[tab].note,
      showFlagStrip: flags > 0,
      flagStripTitle: flags + (flags === 1 ? " flag on your account" : " flags on your account"),
      flagStripNote: (3 - flags) + " more will pause your ability to book rides",
      openFlags: () => this.say("Screen 8 — flags and account status — is not built yet."),
      goHome: () => { window.location.href = "3. Rider Home Dues Popup.dc.html"; },
      navItems: [
        {icon:"bike", label:"Ride"},
        {icon:"receipt-text", label:"Dues", active:true, showDot:true},
        {icon:"layout-grid", label:"All Services"},
        {icon:"plane", label:"Travel"},
        {icon:"user-round", label:"Profile"}
      ].map(n => ({
        ...n,
        color: n.active ? "#E5A800" : "#888888",
        weight: n.active ? 700 : 400,
        showDot: !!n.showDot,
        select: n.label === "Ride" ? () => { window.location.href = "3. Rider Home Dues Popup.dc.html"; } : () => {}
      })),
      toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
